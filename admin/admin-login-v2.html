<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADMIN-TEST-123</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:350px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h2 style="text-align:center;">
🔐 Admin Login
</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button type="button" id="loginBtn" onclick="alert('BUTTON WORKING')">
Login
</button>
<a href="../forgot-password.html" style="display:block;text-align:center;margin-top:15px;">Forgot Password? 🔑</a>

</div>

<script type="module" src="../js/../js/admin-login.js"></script>

</body>

</html>
