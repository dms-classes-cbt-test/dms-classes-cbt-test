<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Subject</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2,h3{
    text-align:center;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
    background:#2196F3;
    font-size:16px;
}

.delete{
    background:#f44336;
}

.back{
    background:#ff9800;
}

.subject-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:5px;
    background:#fafafa;
}

</style>

</head>

<body>

<div class="container">

<h2>📘 Add Subject</h2>

<form id="subjectForm">

<input
    type="text"
    id="subjectName"
    placeholder="Enter Subject Name"
    required
>

<button type="submit">
💾 Save Subject
</button>

</form>

<hr>

<h3>📚 Subject List</h3>

<div id="subjectList">
    Loading...
</div>

<br>

<button
    class="back"
    onclick="location.href='admin-dashboard.html'">

⬅ Back Dashboard

</button>

</div>


<!-- Firebase Subject Script -->

<script type="module">

import {
    db,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
} from "../js/firebase.js";


const form =
    document.getElementById("subjectForm");

const subjectName =
    document.getElementById("subjectName");

const subjectList =
    document.getElementById("subjectList");


/* ======================================
   LOAD SUBJECTS
   ====================================== */

async function loadSubjects(){

    subjectList.innerHTML = "Loading...";

    try{

        const snapshot =
            await getDocs(
                collection(db,"subjects")
            );

        subjectList.innerHTML = "";

        if(snapshot.empty){

            subjectList.innerHTML =
                "<p>No subjects added yet.</p>";

            return;
        }

        snapshot.forEach(function(subject){

            const data =
                subject.data();

            const div =
                document.createElement("div");

            div.className =
                "subject-item";

            div.innerHTML = `
                <span>
                    <b>📘</b>
                    ${escapeHTML(
                        data.subjectName || "Unnamed"
                    )}
                </span>

                <button
                    class="delete"
                    data-id="${subject.id}">

                    🗑 Delete

                </button>
            `;

            const deleteButton =
                div.querySelector(".delete");

            deleteButton.addEventListener(
                "click",
                function(){

                    deleteSubject(subject.id);

                }
            );

            subjectList.appendChild(div);

        });

    }
    catch(error){

        console.error(error);

        subjectList.innerHTML =
            "<p style='color:red;'>Subjects load nahi ho rahe.</p>";

        alert(
            "Subjects load error: " +
            error.message
        );

    }

}


/* ======================================
   SAVE SUBJECT
   ====================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const name =
            subjectName.value.trim();

        if(!name){

            alert(
                "Please enter Subject Name."
            );

            return;
        }

        try{

            /* Check duplicate */

            const snapshot =
                await getDocs(
                    collection(db,"subjects")
                );

            let exists = false;

            snapshot.forEach(function(subject){

                const data =
                    subject.data();

                if(
                    (data.subjectName || "")
                    .toLowerCase() ===
                    name.toLowerCase()
                ){

                    exists = true;

                }

            });


            if(exists){

                alert(
                    "This Subject already exists."
                );

                return;
            }


            /* Save to Firestore */

            await addDoc(
                collection(db,"subjects"),
                {
                    subjectName:name,
                    createdAt:new Date()
                }
            );


            alert(
                "Subject Saved Successfully ✅"
            );

            subjectName.value = "";

            loadSubjects();

        }
        catch(error){

            console.error(error);

            alert(
                "Subject save error: " +
                error.message
            );

        }

    }
);


/* ======================================
   DELETE SUBJECT
   ====================================== */

async function deleteSubject(id){

    if(
        !confirm(
            "Delete this subject?"
        )
    ){

        return;
    }

    try{

        await deleteDoc(
            doc(db,"subjects",id)
        );

        alert(
            "Subject Deleted ✅"
        );

        loadSubjects();

    }
    catch(error){

        console.error(error);

        alert(
            "Delete error: " +
            error.message
        );

    }

}


/* ======================================
   HTML ESCAPE
   ====================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ======================================
   START
   ====================================== */

loadSubjects();

</script>

</body>

</html>
