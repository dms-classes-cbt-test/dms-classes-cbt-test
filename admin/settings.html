<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Settings</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
width:100%;
padding:15px;
margin:10px 0;
font-size:16px;
cursor:pointer;
border:none;
border-radius:5px;
background:#2196F3;
color:white;
}

button:hover{
background:#1976D2;
}

.danger{
background:#e53935;
}

.danger:hover{
background:#c62828;
}

</style>

</head>

<body>

<div class="container">

<h2>⚙ Admin Settings</h2>

<hr>

<button onclick="clearSubjects()">
🗑 Delete All Subjects
</button>

<button onclick="clearTopics()">
🗑 Delete All Topics
</button>

<button onclick="clearQuestions()">
🗑 Delete All Questions
</button>

<button onclick="clearStudents()">
🗑 Delete All Students
</button>

<button onclick="clearResults()">
🗑 Delete All Results
</button>

<button class="danger" onclick="resetSystem()">
💥 Reset Complete System
</button>

<br><br>

<button onclick="location.href='admin-dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

<script>

function clearSubjects(){

if(confirm("Delete all subjects?")){

localStorage.removeItem("subjects");

alert("All Subjects Deleted");

}

}

function clearTopics(){

if(confirm("Delete all topics?")){

localStorage.removeItem("topics");

alert("All Topics Deleted");

}

}

function clearQuestions(){

if(confirm("Delete all questions?")){

localStorage.removeItem("questions");

alert("All Questions Deleted");

}

}

function clearStudents(){

if(confirm("Delete all students?")){

localStorage.removeItem("students");

alert("All Students Deleted");

}

}

function clearResults(){

if(confirm("Delete all results?")){

localStorage.removeItem("resultHistory");
localStorage.removeItem("leaderboard");

alert("All Results Deleted");

}

}

function resetSystem(){

if(confirm("Reset complete CBT System?")){

localStorage.clear();

alert("System Reset Successfully");

window.location.href="../login.html";

}

}

</script>

</body>

</html>
