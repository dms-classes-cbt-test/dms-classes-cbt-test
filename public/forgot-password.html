<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:350px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
cursor:pointer;
}

a{
display:block;
margin-top:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h2 style="text-align:center;">
🔑 Forgot Password
</h2>

<input
type="email"
id="email"
placeholder="Enter Registered Email">

<button id="resetBtn">
Send Reset Link
</button>

<a href="login.html">
⬅ Back to Login
</a>

</div>

<script type="module" src="js/forgot-password.js"></script>

</body>

</html>
