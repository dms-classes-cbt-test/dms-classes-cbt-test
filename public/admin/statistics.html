<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Statistics</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:20px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#2196F3;
color:#fff;
padding:20px;
border-radius:10px;
text-align:center;
}

.card h3{
margin:0;
font-size:18px;
}

.card h1{
margin-top:10px;
font-size:32px;
}

button{
padding:10px 20px;
margin-top:20px;
cursor:pointer;
}

.center{
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>📈 System Statistics</h2>

<hr>

<div class="grid">

<div class="card">
<h3>👨‍🎓 Students</h3>
<h1 id="students">0</h1>
</div>

<div class="card">
<h3>📘 Subjects</h3>
<h1 id="subjects">0</h1>
</div>

<div class="card">
<h3>📚 Topics</h3>
<h1 id="topics">0</h1>
</div>

<div class="card">
<h3>❓ Questions</h3>
<h1 id="questions">0</h1>
</div>

<div class="card">
<h3>📝 Tests Taken</h3>
<h1 id="tests">0</h1>
</div>

<div class="card">
<h3>🏆 Highest Score</h3>
<h1 id="highest">0</h1>
</div>

<div class="card">
<h3>📊 Average Score</h3>
<h1 id="average">0</h1>
</div>

<div class="card">
<h3>📉 Lowest Score</h3>
<h1 id="lowest">0</h1>
</div>

</div>

<div class="center">

<button id="refreshBtn">
🔄 Refresh
</button>

<button onclick="location.href='admin-dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

</div>

<script type="module" src="../js/statistics.js"></script>

</body>
</html>
