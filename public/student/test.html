<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CBT Test</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:20px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#2196F3;
}

#timer{
font-size:22px;
font-weight:bold;
color:red;
text-align:center;
margin:15px 0;
}

#progressBar{
width:100%;
height:20px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}

#progress{
height:100%;
width:0%;
background:#4CAF50;
}

#questionNo{
font-size:18px;
font-weight:bold;
margin-top:20px;
}

#questionText{
font-size:20px;
margin:20px 0;
font-weight:bold;
}

.option{
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
cursor:pointer;
background:#fafafa;
}

.option:hover{
background:#e3f2fd;
}

input[type=radio]{
margin-right:10px;
}

#palette{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:20px 0;
}

.paletteBtn{
width:40px;
height:40px;
border:none;
border-radius:5px;
cursor:pointer;
background:#ddd;
}

.current{
background:#2196F3;
color:#fff;
}

.answered{
background:#4CAF50;
color:#fff;
}

.review{
background:orange;
color:#fff;
}

.notAnswered{
background:#ddd;
}

.buttons{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
margin-top:25px;
}

button{
padding:10px 20px;
cursor:pointer;
border:none;
border-radius:5px;
background:#2196F3;
color:white;
font-size:15px;
margin:5px;
}

button:hover{
background:#1976D2;
}

</style>

</head>

<body>

<div class="container">

<h2>🎓 DMS CLASSES CBT TEST</h2>

<div id="timer">
Time Left : 10:00
</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<div id="palette"></div>

<div id="questionNo"></div>

<div id="questionText"></div>

<div class="option">
<label>
<input type="radio" name="answer" value="">
<span id="option1"></span>
</label>
</div>

<div class="option">
<label>
<input type="radio" name="answer" value="">
<span id="option2"></span>
</label>
</div>

<div class="option">
<label>
<input type="radio" name="answer" value="">
<span id="option3"></span>
</label>
</div>

<div class="option">
<label>
<input type="radio" name="answer" value="">
<span id="option4"></span>
</label>
</div>
<div class="buttons">

<button id="prevBtn">
⬅ Previous
</button>

<button id="reviewBtn">
⭐ Mark For Review
</button>

<button id="nextBtn">
Next ➡
</button>

<button id="submitBtn">
✅ Submit Test
</button>

</div>

</div>

<script type="module" src="../js/test-engine.js"></script>

</body>
</html>
