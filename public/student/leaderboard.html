<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
font-family:Arial,sans-serif;
margin:20px;
}

.container{
max-width:800px;
margin:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table,th,td{
border:1px solid #ccc;
}

th,td{
padding:10px;
text-align:center;
}

th{
background:#2196F3;
color:white;
}

button{
padding:10px 20px;
margin-top:20px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>🏆 Leaderboard</h2>

<table>

<thead>

<tr>

<th>Rank</th>

<th>Name</th>

<th>Score</th>

<th>Total</th>

<th>Percentage</th>

<th>Date</th>

</tr>

</thead>

<tbody id="leaderboardBody">

</tbody>

</table>

<br>

<button onclick="location.href='dashboard.html'">
Back to Dashboard
</button>

</div>

<script>

let leaderboard =
JSON.parse(localStorage.getItem("leaderboard")) || [];

leaderboard.sort(function(a,b){

return b.score-a.score;

});

let body =
document.getElementById("leaderboardBody");

if(leaderboard.length===0){

body.innerHTML =
"<tr><td colspan='6'>No Results Available</td></tr>";

}else{

leaderboard.forEach(function(item,index){

body.innerHTML += `

<tr>

<td>${index+1}</td>

<td>${item.name}</td>

<td>${item.score}</td>

<td>${item.total}</td>

<td>${item.percentage}%</td>

<td>${item.date}</td>

</tr>

`;

});

}

</script>

</body>

</html>
