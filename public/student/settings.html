<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:20px;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

button{
width:100%;
padding:12px;
margin:10px 0;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>⚙ Settings</h2>

<button onclick="clearHistory()">
🗑 Clear Result History
</button>

<button onclick="clearLeaderboard()">
🏆 Clear Leaderboard
</button>

<button onclick="location.href='dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

<script>

function clearHistory(){

if(confirm("Delete Result History?")){

localStorage.removeItem("resultHistory");

alert("History Deleted");

}

}

function clearLeaderboard(){

if(confirm("Delete Leaderboard?")){

localStorage.removeItem("leaderboard");

alert("Leaderboard Deleted");

}

}

</script>

</body>
</html>
